<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Admin Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
    }
    .login-box {
      width: 90%;
      max-width: 380px;
      padding: 28px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 25px #0001;
    }
    h2 { text-align: center; color: #123b68; }
    p { text-align: center; color: #64748b; }
    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border-radius: 7px;
      font-size: 16px;
    }
    input { border: 1px solid #cbd5e1; }
    button {
      border: none;
      background: #1769aa;
      color: white;
      font-weight: bold;
    }
    #message { font-size: 14px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Hospital Admin</h2>
    <p>Sign in to manage appointments</p>

    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin Email"
             autocomplete="username" required>
      <input id="password" type="password" placeholder="Password"
             autocomplete="current-password" required>
      <button type="submit">Login</button>
    </form>

    <p id="message" role="status"></p>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from
      "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

    // Add your own Firebase Web App configuration here.
    const firebaseConfig = {
      apiKey: "PASTE_YOUR_API_KEY",
      authDomain: "testing-fire-18d72.firebaseapp.com",
      databaseURL: "https://testing-fire-18d72-default-rtdb.firebaseio.com",
      projectId: "testing-fire-18d72",
      storageBucket: "testing-fire-18d72.firebasestorage.app",
      messagingSenderId: "49748560737",
      appId: "PASTE_YOUR_WEB_APP_ID"
    };

    const message = document.getElementById("message");

    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      document.getElementById("loginForm").addEventListener("submit",
        async (event) => {
          event.preventDefault();
          message.textContent = "Please wait...";

          try {
            await signInWithEmailAndPassword(
              auth,
              document.getElementById("email").value.trim(),
              document.getElementById("password").value
            );
            message.textContent = "Login successful.";
          } catch (error) {
            message.textContent = "Login failed. Check your details.";
          }
        });
    } catch (error) {
      message.textContent = "Firebase configuration needs to be completed.";
    }
  </script>
</body>
</html>

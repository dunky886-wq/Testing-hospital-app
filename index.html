<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Admin Login</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
    }
    .box {
      width: calc(100% - 56px);
      max-width: 360px;
      padding: 28px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 25px #0001;
    }
    h2 { text-align: center; color: #123b68; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 14px;
      border-radius: 7px;
      font-size: 16px;
    }
    input { border: 1px solid #cbd5e1; }
    button {
      border: 0;
      background: #1769aa;
      color: white;
      font-weight: bold;
    }
    #message { color: #b91c1c; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Hospital Admin</h2>
    <p>Sign in to manage appointments</p>

    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin Email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p id="message" role="status"></p>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from
      "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBBLhDaZIu3EvMUqoXem4Pyc-DG2g7XXEw",
      authDomain: "testing-fire-18d72.firebaseapp.com",
      databaseURL: "https://testing-fire-18d72-default-rtdb.firebaseio.com",
      projectId: "testing-fire-18d72",
      storageBucket: "testing-fire-18d72.firebasestorage.app",
      messagingSenderId: "49748560737",
      appId: "1:49748560737:web:ec3794a1cdaf8ac0cb1320"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const message = document.getElementById("message");

    document.getElementById("loginForm").addEventListener("submit",
      async (event) => {
        event.preventDefault();
        message.textContent = "Please wait...";

        try {
          await signInWithEmailAndPassword(
            auth,
            document.getElementById("email").value.trim(),
            document.getElementById("password").value
          );
          message.textContent = "Login successful!";
        } catch (error) {
          message.textContent =
            "Login failed. Check the email and password.";
        }
      });
  </script>
</body>
</html>
